<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Animación de Entrada</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    html,
    body{
      width:100%;
      height:100%;
      overflow:hidden;
      background:#000;
    }

    .intro{
      position:fixed;
      inset:0;
      width:100vw;
      height:100vh;
      background:#000;
    }

    .intro video{
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
    }
  </style>
</head>
<body>

  <div class="intro">
    <video
      id="introVideo"
      autoplay
      muted
      playsinline
      preload="auto"
    >
      <source src="/video/animacion-entrada.mp4" type="video/mp4">
      Tu navegador no soporta videos.
    </video>
  </div>

  <script>
    const video = document.getElementById("introVideo");

    // Reproducir al doble de velocidad
    video.addEventListener("loadedmetadata", () => {
      video.playbackRate = 2;
    });

    // Cuando termine, ir a index.html
    video.addEventListener("ended", () => {
      window.location.replace("/");
    });

    // Si ocurre un error al cargar el video
    video.addEventListener("error", () => {
      window.location.replace("/");
    });
  </script>

</body>
</html>
