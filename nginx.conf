server {
    listen       80;
    server_name  _;

    root /usr/share/nginx/html;
    index index.html;

    # Compresión
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Healthcheck simple (sin pasar por la SPA)
    location = /health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok"}';
    }

    # Assets con hash: caché larga
    location ~* \.(js|css|png|jpg|jpeg|gif|webp|avif|svg|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Archivos estáticos de public/ sin hash (fotos, bases, video, logo)
    location ~* ^/(fotos|bases|video|logo|carrusel-img|cordinadora|fonts)/ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # index.html: nunca en caché (así los despliegues se aplican al instante)
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # SPA: cualquier ruta cae al index
    location / {
        try_files $uri $uri/ /index.html;
    }
}
